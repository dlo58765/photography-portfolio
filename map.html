<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map · RexChen Photography</title>
    <meta name="description" content="Where each frame was made — the stops of RexChen's Norway and Iceland chapters on a map." />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0a0c'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23c8a96b' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        :root {
            --text: #f5f4ef;
            --accent: #7ec7ff;
            --transition: 0.28s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #050608;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: #232326; /* 圖磚載入前與 Esri 暗色底圖同色，避免露出淺灰 */
        }

        /* Marker: a 34px box whose centre is the location (iconAnchor 17,17). */
        .pulse-marker {
            width: 34px;
            height: 34px;
            position: relative;
            animation: float-marker 4s ease-in-out infinite;
        }

        .pulse-marker::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 2px solid rgba(255, 199, 102, 0.54);
            box-shadow: 0 0 18px rgba(255, 188, 76, 0.24);
            pointer-events: none;
        }

        .pulse-marker .pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255, 183, 73, 0.28);
            animation: pulse-ring 1.8s infinite ease-out;
        }

        .pulse-marker .marker-core {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            background: #ffbf47;
            border: 3px solid rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 22px rgba(255, 191, 87, 0.5);
            transition: transform var(--transition), background var(--transition), box-shadow var(--transition), border-color var(--transition);
        }

        .pulse-marker:hover .marker-core {
            background: #ffd568;
            transform: translate(-50%, -50%) scale(1.25);
            box-shadow: 0 0 32px rgba(255, 210, 115, 0.7);
            border-color: rgba(255, 255, 255, 1);
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.9);
                opacity: 0.65;
            }
            70% {
                transform: scale(2.4);
                opacity: 0;
            }
            100% {
                transform: scale(2.8);
                opacity: 0;
            }
        }

        @keyframes float-marker {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-2px);
            }
        }

        .map-tip {
            position: absolute;
            right: 26px;
            top: 24px;
            z-index: 9;
            padding: 14px 18px;
            border-radius: 18px;
            background: rgba(7, 12, 24, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 0.95rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
            backdrop-filter: blur(16px);
            max-width: min(320px, calc(100vw - 46px));
        }

        .map-tip strong {
            color: var(--accent);
        }

        /* "← Norway" link, a Leaflet control stacked above the zoom buttons. */
        .leaflet-control.map-back {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(7, 12, 24, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-decoration: none;
            backdrop-filter: blur(16px);
            transition: border-color var(--transition);
        }

        .leaflet-control.map-back:hover {
            border-color: rgba(255, 199, 102, 0.6);
            color: var(--text);
        }

        @media (max-width: 768px) {
            /* Top right, beside the Back control, so it never covers the
               attribution along the bottom edge. */
            .map-tip {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
                border-radius: 14px;
                font-size: 0.82rem;
                max-width: calc(100vw - 150px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-marker,
            .pulse-marker .pulse-ring {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        <div class="map-tip"><strong>Tip:</strong> click a marker to open its chapter.</div>
    </div>

    <script src="locations-data.js"></script>
    <script>
        // ===== 判斷要顯示哪一個系列 =====
        // ?series=iceland  →  冰島  ;  預設為挪威
        const params = new URLSearchParams(window.location.search);
        const series = (params.get('series') || 'norway').toLowerCase();

        const SERIES = {
            norway: {
                label: 'Norway',
                locations: LOCATIONS_DATA,
                targetHtml: 'norway.html'
            },
            iceland: {
                label: 'Iceland',
                locations: ICELAND_LOCATIONS_DATA,
                targetHtml: 'iceland.html'
            }
        };

        const cfg = SERIES[series] || SERIES.norway;
        const locations = cfg.locations;
        document.title = `${cfg.label} Map · RexChen Photography`;

        // 縮放維持整數級距：小數級距會讓圖磚接縫出現細線
        const map = L.map('map', {
            zoomControl: false,
            maxZoom: 19
        });

        // 返回相冊：放在左上角、縮放按鈕上方
        const BackControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd() {
                const link = L.DomUtil.create('a', 'map-back');
                link.href = cfg.targetHtml;
                link.textContent = `← ${cfg.label}`;
                L.DomEvent.disableClickPropagation(link);
                return link;
            }
        });
        new BackControl().addTo(map);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // 依所有地點自動縮放，任何螢幕尺寸都能看到全部標記
        // （上方多留空間給返回鈕與提示框）
        const bounds = L.latLngBounds(Object.values(locations).map((l) => [l.lat, l.lng]));
        map.fitBounds(bounds, { paddingTopLeft: [48, 96], paddingBottomRight: [48, 48] });
        // 可以比預設再拉遠一點，但不會縮到整個世界
        map.setMinZoom(Math.max(map.getZoom() - 1, 3));

        // CARTO 底圖現在需要 API key，改用免 key 的 Esri Dark Gray Canvas（底圖 + 地名標籤）
        const ESRI_CANVAS = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas';
        L.tileLayer(`${ESRI_CANVAS}/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
            attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
            maxNativeZoom: 16,
            maxZoom: 19
        }).addTo(map);
        L.tileLayer(`${ESRI_CANVAS}/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, {
            maxNativeZoom: 16,
            maxZoom: 19
        }).addTo(map);

        // 建立標記
        const markers = {};

        function createMarkers() {
            Object.entries(locations).forEach(([key, location]) => {
                const markerHtml = `
                    <div class="pulse-marker" data-key="${key}">
                        <span class="pulse-ring"></span>
                        <span class="marker-core"></span>
                    </div>
                `;
                const marker = L.marker([location.lat, location.lng], {
                    icon: L.divIcon({
                        className: 'custom-div-icon',
                        html: markerHtml,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17]
                    }),
                    title: location.name
                }).addTo(map);

                marker.bindTooltip(location.name, {
                    permanent: false,
                    direction: 'top',
                    offset: [0, -14],
                    opacity: 0.9,
                    className: 'location-tooltip'
                });

                marker.on('click', () => {
                    window.location.href = `${cfg.targetHtml}#stop-${location.number}`;
                });

                markers[key] = marker;
            });
        }

        createMarkers();
    </script>
</body>
</html>
